{% extends 'base/base.html' %}

{% block page_title %}
    Products
{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
        <div class="form-control w-full max-w-xs relative">
            <input 
                type="text" 
                name="q" 
                placeholder="Search products..." 
                class="input input-bordered w-full"
                hx-get="{% url 'sales:product_list' %}"
                hx-trigger="keyup changed delay:300ms, search"
                hx-target="#product-grid"
                hx-indicator=".search-indicator"
            />
            <span class="search-indicator htmx-indicator loading loading-spinner loading-xs absolute right-3 top-4"></span>
        </div>
    </div>

    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        {% include "sales/partials/_product_items.html" %}
    </div>
</div>

<div id="modal-container"></div>
{% endblock %}
