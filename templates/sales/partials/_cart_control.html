<div class="cart-control-wrapper inline-flex">
    {% if item and item.quantity > 0 %}
        <div class="join border border-primary h-8 flex-nowrap">
            <button class="btn btn-xs btn-ghost join-item px-2"
                    hx-post="{% url 'sales:update_cart' product.id %}"
                    hx-vals='{"quantity": "{{ item.quantity|add:"-1" }}"}'
                    hx-target="closest .cart-control-wrapper"
                    hx-swap="outerHTML">
                -
            </button>
            <span class="join-item px-2 flex items-center justify-center bg-white font-bold text-xs min-w-[1.5rem]">
                {{ item.quantity }}
            </span>
            <button class="btn btn-xs btn-ghost join-item px-2"
                    hx-post="{% url 'sales:update_cart' product.id %}"
                    hx-vals='{"quantity": "{{ item.quantity|add:"1" }}"}'
                    hx-target="closest .cart-control-wrapper"
                    hx-swap="outerHTML"
                    {% if item.quantity >= product.stock_qty %}disabled{% endif %}>
                +
            </button>
        </div>
    {% else %}
        <button class="btn btn-sm whitespace-nowrap {% if product.stock_qty <= 0 %}btn-ghost bg-base-200 text-base-content/30{% else %}btn-primary{% endif %}"
                {% if product.stock_qty > 0 %}
                    hx-post="{% url 'sales:update_cart' product.id %}"
                    hx-vals='{"quantity": "1"}'
                    hx-target="closest .cart-control-wrapper"
                    hx-swap="outerHTML"
                {% else %}
                    disabled
                {% endif %}>
            {% if product.stock_qty > 0 %}Add to cart{% else %}Out of stock{% endif %}
        </button>
    {% endif %}
</div>
