<div class="cart-control-wrapper">
    {% if item and item.quantity > 0 %}
        <div class="join border border-primary">
            <button class="btn btn-sm btn-ghost join-item"
                    hx-post="{% url 'sales:update_cart' product.id %}"
                    hx-vals='{"quantity": "{{ item.quantity|add:"-1" }}"}'
                    hx-target="closest .cart-control-wrapper"
                    hx-swap="outerHTML">
                <span class="material-symbols-outlined text-sm">remove</span>
            </button>
            
            <span class="join-item px-4 flex items-center justify-center bg-white font-bold min-w-[3rem] text-sm">
                {{ item.quantity }}
            </span>
            
            <button class="btn btn-sm btn-ghost join-item"
                    hx-post="{% url 'sales:update_cart' product.id %}"
                    hx-vals='{"quantity": "{{ item.quantity|add:"1" }}"}'
                    hx-target="closest .cart-control-wrapper"
                    hx-swap="outerHTML"
                    {% if item.quantity >= product.stock_qty %}disabled{% endif %}>
                <span class="material-symbols-outlined text-sm">add</span>
            </button>
        </div>
    {% else %}
        <button class="btn btn-primary btn-sm w-full gap-2"
                hx-post="{% url 'sales:update_cart' product.id %}"
                hx-vals='{"quantity": "1"}'
                hx-target="closest .cart-control-wrapper"
                hx-swap="outerHTML"
                {% if product.stock_qty <= 0 %}disabled{% endif %}>
            <span class="material-symbols-outlined text-sm">shopping_cart</span>
            {% if product.stock_qty > 0 %}Add to cart{% else %}Out of stock{% endif %}
        </button>
    {% endif %}
</div>
