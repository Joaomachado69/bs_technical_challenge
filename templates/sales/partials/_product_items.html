{% for product in products %}
<div class="card bg-white shadow-md border border-gray-200">
    <figure class="px-4 pt-4">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="rounded-xl h-40 w-full object-cover" />
        {% else %}
            <div class="bg-base-200 rounded-xl h-40 w-full flex items-center justify-center text-base-content/30">
                <span class="material-symbols-outlined text-4xl">image</span>
            </div>
        {% endif %}
    </figure>

    <div class="card-body p-4">
        <h2 class="card-title text-sm font-bold h-12 overflow-hidden">{{ product.name }}</h2>
        <div class="flex justify-between items-center mt-2">
            <span class="text-lg font-bold text-primary">${{ product.price }}</span>
            <span class="text-xs badge badge-ghost">Stock: {{ product.stock_qty }}</span>
        </div>
        <div class="card-actions justify-between mt-4">
            <button class="btn btn-ghost btn-xs text-primary"
                    hx-get="{% url 'sales:product_detail_modal' product.pk %}"
                    hx-target="#modal-container"
                    hx-swap="innerHTML">
                View details
            </button>
            <div id="cart-control-{{ product.id }}" class="flex-grow flex justify-end">
                {% include "sales/partials/_cart_control.html" with product=product item=product.cart_item %}
            </div>
        </div>
    </div>
</div>
{% endfor %}
