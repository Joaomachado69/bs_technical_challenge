<dialog id="product_modal" class="modal" x-data x-init="$el.showModal()" @click.self="$el.close()" @close="$el.remove()" @keydown.escape="$el.close()">
    <div class="modal-box max-w-2xl shadow-2xl border border-base-300 relative">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 z-50" @click="$el.closest('dialog').close()">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="flex flex-col md:flex-row gap-8">
            <div class="w-full md:w-1/2">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="rounded-2xl w-full h-64 md:h-full object-cover shadow-inner" />
                {% else %}
                    <div class="bg-base-200 rounded-2xl h-64 md:h-full w-full flex items-center justify-center text-base-content/30"><span class="material-symbols-outlined text-7xl">image</span></div>
                {% endif %}
            </div>
            <div class="w-full md:w-1/2 flex flex-col">
                <h3 class="font-bold text-3xl text-base-content">{{ product.name }}</h3>
                <p class="text-2xl font-bold text-primary mt-2">${{ product.price }}</p>
                <div class="divider my-2"></div>
                <div class="flex-grow">
                    <h4 class="text-xs font-bold uppercase tracking-widest text-base-content/40 mb-2">Description</h4>
                    <p class="text-base-content/80 leading-relaxed text-sm">{{ product.description|default:"No description provided." }}</p>
                </div>
                <div class="mt-6 border-t pt-4">
                    <div class="flex items-center justify-between mb-4 text-sm">
                        <span>Stock Available:</span>
                        <span class="badge badge-success font-bold">{{ product.stock_qty }} units</span>
                    </div>
                    <div id="cart-control-modal-{{ product.id }}">
                        {% include "sales/partials/_cart_control.html" with product=product item=item %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-backdrop bg-black/50"></div>
</dialog>
