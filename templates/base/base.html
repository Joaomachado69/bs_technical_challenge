{% load static %}
<!DOCTYPE html>
<html lang="en" x-data="{ menuOpen: false }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sales APP{% endblock %}</title>
    <link rel="stylesheet" href="{% static "dist/css/default.css" %}">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/alpinejs@3.14.1" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col lg:flex-row" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

<div class="drawer lg:drawer-open">
    <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col">
        <nav class="flex items-center p-4 w-full bg-white shadow justify-between">
            <div class="flex items-center gap-2">
                <label for="my-drawer-2" class="btn btn-sm btn-ghost lg:hidden">
                    <span class="material-symbols-outlined">menu</span>
                </label>
                <h1 class="text-xl font-semibold">{% block page_title %}Sales App{% endblock %}</h1>
            </div>
            <div class="flex items-center">
                <div class="btn btn-sm btn-ghost">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span class="badge badge-sm badge-error text-white">
                        <span id="item_count_badge">{{ cart_item_count|default:"0" }}</span>
                    </span>
                </div>
            </div>
        </nav>
        <div class="flex-1 p-4">{% block content %}{% endblock %}</div>
    </div>
    <div class="drawer-side bg-white border-r">
        <label for="my-drawer-2" class="drawer-overlay"></label>
        <div class="flex gap-2 items-center px-6" style="height: 64px">
            <img src="{% static 'images/logo.png' %}" alt="Logo" class="w-12 h-12" />
            <h1 class="font-bold text-lg">Sales App</h1>
        </div>
        <ul class="menu text-base-content w-80 p-4">
            <li><a href="{% url 'sales:home' %}"><span class="material-symbols-outlined">home</span><span>Home</span></a></li>
            <li><a href="{% url 'sales:product_list' %}"><span class="material-symbols-outlined">package</span><span>Products</span></a></li>
            <li><a href="#"><span class="material-symbols-outlined">history</span><span>Sales History</span></a></li>
        </ul>
    </div>
</div>

<script>
    document.body.addEventListener('htmx:configRequest', (event) => {
        event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
    });
</script>
</body>
</html>
